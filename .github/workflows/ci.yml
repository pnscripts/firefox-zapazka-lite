name: CI

# Every push to main and every pull request: the unit tests, Mozilla's own
# add-on linter (the check addons.mozilla.org runs on upload) and the audit of
# the development tools.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung step (network, installer) stops here, not after GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The extension ships no npm package; everything here is a build tool.
      # deepmerge (through addons-linter) has a low advisory with no fixed
      # release, so the gate is moderate and above.
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Tests
        run: npm test
      - name: Add-on linter
        run: npm run lint
